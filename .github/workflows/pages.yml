name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site/assets _site/app
          cp about.html admin.html admissions.html fees.html index.html payment.html programs.html school-life.html specialties.html suivi.html api-config.js language.js script.js suivi.js styles.css papyrus-logo.png robots.txt sitemap.xml _site/
          cp app/payment.js app/styles.css app/papyrus-logo.png _site/app/
          cp -R assets/. _site/assets/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4